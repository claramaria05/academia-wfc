:3,userId:3,description:'Mensalidade · Setembro',amount:109.9,due:future(5),status:'Pendente'}]};function today(){return new Date().toISOString().slice(0,10)}function future(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}function past(n){return future(-n)}let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed}catch{db=seed}let session=JSON.parse(sessionStorage.getItem('wcf-session')||'null'),page='inicio',authTab='login',modal=null,filter='',statusFilter='',toastTimer;const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),me=()=>db.users.find(u=>u.id===session?.id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR'),money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),mod=id=>db.modalidades.find(m=>m.id==id),user=id=>db.users.find(u=>u.id==id),fmt=s=>esc(s);function notify(message){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3200)}function badge(s){return `<span class="badge ${['Pendente'].includes(s)?'warn':['Cancelada','Inativa'].includes(s)?'red':['Concluída'].includes(s)?'gray':''}">${esc(s)}</span>`}function go(p){page=p;filter='';statusFilter='';modal=null;render();window.scrollTo(0,0)}function setFilter(v){filter=v;renderBody()}function setStatus(v){statusFilter=v;renderBody()}function authenticate(e){e.preventDefault();let form=e.target,email=form.email.value.trim().toLowerCase(),pass=form.password.value;let u=db.users.find(x=>x.email.toLowerCase()===email&&x.password===pass);if(!u)return notify('E-mail ou senha incorretos.');session={id:u.id};sessionStorage.setItem('wcf-session',JSON.stringify(session));go('inicio')}function register(e){e.preventDefault();let f=e.target,email=f.email.value.trim().toLowerCase();if(db.users.some(u=>u.email.toLowerCase()===email))return notify('Esse e-mail já está cadastrado.');if(f.password.value.length<6)return notify('Use uma senha com pelo menos 6 caracteres.');let u={id:next(db.users),name:f.name.value.trim(),email,password:f.password.value,phone:f.phone.value.trim(),role:'aluno'};db.users.push(u);save();session={id:u.id};sessionStorage.setItem('wcf-session',JSON.stringify(session));go('inicio');notify('Cadastro criado com sucesso!')}function logout(){session=null;sessionStorage.removeItem('wcf-session');go('inicio')}function next(arr){return Math.max(0,...arr.map(x=>x.id))+1}function auth(){return `<div class="auth"><div class="auth-art"><div class="logo">WCF<span>.</span><small>ACADEMIA</small></div><div><h1>Seu movimento começa <span>aqui.</span></h1><p>Uma experiência mais simples para cuidar do seu treino.</p></div><p>© Academia WCF · Projeto Integrador</p></div><main class="auth-main"><div class="auth-box"><h2>${authTab==='login'?'Bem-vindo de volta':'Crie sua conta'}</h2><p>${authTab==='login'?'Acesse suas aulas, matrículas e pagamentos em um só lugar.':'Comece a organizar sua rotina na WCF.'}</p><div class="tabs"><button class="${authTab==='login'?'active':''}" onclick="authTab='login';render()">Entrar</button><button class="${authTab==='register'?'active':''}" onclick="authTab='register';render()">Criar conta</button></div>${authTab==='login'?`<form onsubmit="authenticate(event)"><label class="field">E-mail<input name="email" type="email" required placeholder="seu@email.com"></label><label class="field">Senha<input name="password" type="password" required placeholder="Sua senha"></label><button class="btn">Entrar na plataforma</button></form><p class="help">Demonstração: aluno@wcf.com ou admin@wcf.com · senha 123456</p>`:`<form onsubmit="register(event)"><label class="field">Nome completo<input name="name" required minlength="2" placeholder="Seu nome"></label><label class="field">E-mail<input n admin):page==='pagamentos'?payments(admin):page==='alunos'&&admin?students():dashboard(admin)}function stat(label,value,hint){return `<div class="card stat"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`}function dashboard(admin){let u=me(),myMat=db.matriculas.filter(m=>m.userId===u.id&&m.status==='Ativa'),myPay=db.pagamentos.filter(p=>p.userId===u.id),upcoming=db.aulas.filter(a=>a.date>=today()&&(admin||myMat.some(m=>m.modalityId===a.modalityId))).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)).slice(0,3);let lead=admin?'Sua academia, em um só lugar.':'Seu próximo treino começa aqui.';return `<h1>Olá, ${esc(u.name.split(' ')[0])} 👋</h1><p class="sub">${admin?'Acompanhe os principais números da Academia WCF.':'Confira sua rotina e mantenha tudo em dia.'}</p><div class="hero"><div><strong>${admin?'Painel administrativo':'Vamos treinar?'}</strong><h2>${lead}</h2><p>${admin?'Organize alunos, turmas, matrículas e pagamentos em um único painel.':'Explore modalidades, veja os horários disponíveis e confirme sua participação nas aulas.'}</p></div><div class="action"><button class="btn" onclick="go('${admin?'alunos':'modalidades'}')">${admin?'Gerenciar alunos':'Explorar modalidades'} →</button></div></div><div class="grid">${admin?stat('Alunos cadastrados',db.users.filter(x=>x.role==='aluno').length,'Total na plataforma')+stat('Matrículas ativas',db.matriculas.filter(x=>x.status==='Ativa').length,'Em todas as modalidades')+stat('Aulas agendadas',db.aulas.filter(x=>x.date>=today()).length,'Próximas datas')+stat('Pagamentos pendentes',db.pagamentos.filter(x=>x.status==='Pendente').length,'Acompanhe os recebimentos'):stat('Minhas modalidades',myMat.length,'Matrículas ativas')+stat('Próximas aulas',upcoming.length,'Na sua programação')+stat('Presenças confirmadas',db.presencas.filter(x=>x.userId===u.id&&x.status==='Confirmada').length,'Sua participação')+stat('Pagamentos pendentes',myPay.filter(x=>x.status==='Pendente').length,'Acompanhe seus valores')}</div><div class="section two"><div class="card"><div class="section-head"><h2>Próximas aulas</h2><button class="link" onclick="go('aulas')">Ver todas →</button></div>${upcoming.length?upcoming.map(a=>classRow(a,admin)).join(''):'<p class="empty">Nenhuma aula agendada por enquanto.</p>'}</div><div class="card"><div class="section-head"><h2>${admin?'Visão financeira':'Minhas matrículas'}</h2><button class="link" onclick="go('${admin?'pagamentos':'matriculas'}')">Ver detalhes →</button></div>${admin?`<div class="list-row"><span>Recebido</span><strong>${money(db.pagamentos.filter(p=>p.status==='Pago').reduce((n,p)=>n+Number(p.amount),0))}</strong></div><div class="list-row"><span>Em aberto</span><strong>${money(db.pagamentos.filter(p=>p.status==='Pendente').reduce((n,p)=>n+Number(p.amount),0))}</strong></div>`:myMat.length?myMat.map(m=>`<div class="list-row"><div><strong>${esc(mod(m.modalityId)?.name||'Modalidade removida')}</strong><div class="muted">Desde ${date(m.date)}</div></div>${badge(m.status)}</div>`).join(''):'<p class="empty">Explore as modalidades e faça sua primeira matrícula.</p>'}</div></div>`}function classRow(a,admin){let m=mod(a.modalityId),count=db.presencas.filter(p=>p.aulaId===a.id&&p.status==='Confirmada').length,p=db.presencas.find(p=>p.aulaId===a.id&&p.userId===me().id);return `<div class="class-row"><div class="class-info"><div class="datebox">${date(a.date).slice(0,2)}<small>${new Date(a.date+'T12:00:00').toLocaleDateString('pt-BR',{month:'short'}).toUpperCase().replace('.','')}</small></div><div><strong>${esc(m?.name||'Modalidade removida')}</strong><div class="muted">${esc(a.time)} · ${esc(a.instructor)} · ${count}/${a.capacity} vagas</div></div></div>${admin?badge('Agendada'):p?badge('Confirmada'):`<button class="btn secondary" onclick="confirmClass(${a.id})">Confirmar</button>`}</div>`}function modalities(admin){let rows=db.modalidades.filter(m=>m.name.toLowerCase().includes(filter.toLowerCase()));return `<div class="panel"><div><h1>Modalidades</h1><p class="sub">${admin?'Organize as atividades oferecidas pela academia.':'Encontre a atividade ideal para sua rotina.'}</p></div>${admin?'<button class="btn" onclick="openModal(\'modality\')">+ Nova modalidade</button>':''}</div><div class="toolbar"><input aria-label="Buscar modalidades" placeholder="Buscar modalidade..." value="${esc(filter)}" oninput="setFilter(this.value)"></div><div class="cards3">${rows.map(m=>{let enrolled=db.matriculas.some(x=>x.userId===me().id&&x.modalityId===m.id&&x.status==='Ativa');return `<div class="card course"><div class="course-art">${m.icon||'✦'}</div><div class="course-body"><h3>${esc(m.name)}</h3><p>${esc(m.description)}</p><div class="small">◷ ${esc(m.days)} · ${esc(m.time)}</div><div class="small" style="margin-top:6px">♙ ${esc(m.instructor)}</div><div class="course-foot">${admin?`<span class="small">${db.matriculas.filter(x=>x.modalityId===m.id&&x.status==='Ativa').length} alunos</span><button class="btn secondary" onclick="openModal('modality',${m.id})">Editar</button>`:enrolled?`<span class="badge">Matriculado</span><button class="link" onclick="go('aulas')">Ver aulas →</button>`:`<span class="small">Vagas disponíveis</span><button class="btn" onclick="enroll(${m.id})">Matricular-se</button>`}</div></div></div>`}).join('')||'<p class="empty">Nenhuma modalidade encontrada.</p>'}</div>`}function classes(admin){let rows=db.aulas.filter(a=>a.date>=today()&&(!filter||mod(a.modalityId)?.name.toLowerCase().includes(filter.toLowerCase()))).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));return `<div class="panel"><div><h1>Aulas e horários</h1><p class="sub">${admin?'Organize a programação e acompanhe as confirmações.':'Confira as aulas e confirme sua participação.'}</p></div>${admin?'<button class="btn" onclick="openModal(\'class\')">+ Nova aula</button>':''}</div><div class="toolbar"><input aria-label="Buscar aulas" placeholder="Buscar modalidade..." value="${esc(filter)}" oninput="setFilter(this.value)"></div><div class="card">${rows.length?rows.map(a=>`<div class="class-row"><div class="class-info"><div class="datebox">${date(a.date).slice(0,2)}<small>${new Date(a.date+'T12:00:00').toLocaleDateString('pt-BR',{month:'short'}).toUpperCase().replace('.','')}</small></div><div><strong>${esc(mod(a.modalityId)?.name||'Modalidade removida')}</strong><div class="muted">${date(a.date)} às ${esc(a.time)} · ${esc(a.instructor)} · ${db.presencas.filter(p=>p.aulaId===a.id&&p.status==='Confirmada').length}/${a.capacity} confirmados</div></div></div><div class="actions">${admin?`<button onclick="openModal('class',${a.id})">Editar</button><button onclick="removeClass(${a.id})">Excluir</button>`:db.presencas.some(p=>p.aulaId===a.id&&p.userId===me().id&&p.status==='Confirmada')?`<button onclick="cancelClass(${a.id})">Cancelar presença</button>`:`<button onclick="confirmClass(${a.id})">Confirmar presença</button>`}</div></div>`).join(''):'<p class="empty">Nenhuma aula futura encontrada.</p>'}</div>`}function enroll(mid){if(db.matriculas.some(m=>m.userId===me().id&&m.modalityId===mid&&m.status==='Ativa'))return notify('Você já está matriculado nesta modalidade.');db.matriculas.push({id:next(db.matriculas),userId:me().id,modalityId:mid,date:today(),status:'Ativa'});save();renderBody();notify('Matrícula realizada com sucesso!')}function confirmClass(id){let a=db.aulas.find(x=>x.id===id);if(!a||a.date<today())return notify('Aula indisponível.');if(!db.matriculas.some(m=>m.userId===me().id&&m.modalityId===a.modalityId&&m.status==='Ativa'))return notify('Matricule-se na modalidade antes de confirmar sua presença.');if(db.presencas.some(p=>p.aulaId===id&&p.userId===me().id&&p.status==='Confirmada'))return notify('Presença já confirmada.');if(db.presencas.filter(p=>p.aulaId===id&&p.status==='Confirmada').length>=a.capacity)return notify('A turma está lotada.');let p=db.presencas.find(p=>p.aulaId===id&&p.userId===me().id);if(p)p.status='Confirmada';else db.presencas.push({id:next(db.presencas),userId:me().id,aulaId:id,status:'Confirmada'});save();renderBody();notify('Presença confirmada!')}function cancelClass(id){let p=db.presencas.find(x=>x.aulaId===id&&x.userId===me().id);if(p){p.status='Cancelada';save();renderBody();notify('Presença cancelada.')}}function enrollments(admin){let rows=db.matriculas.filter(m=>(admin||m.userId===me().id)&&(!filter||(mod(m.modalityId)?.name||'').toLowerCase().includes(filter.toLowerCase())||(user(m.userId)?.name||'').toLowerCase().includes(filter.toLowerCase()))&&(!statusFilter||m.status===statusFilter));return `<div class="panel"><div><h1>${admin?'Matrículas':'Minhas matrículas'}</h1><p class="sub">${admin?'Acompanhe o vínculo dos alunos com as modalidades.':'Acompanhe as atividades em que você participa.'}</p></div>${admin?'<button class="btn" onclick="openModal(\'enrollment\')">+ Nova matrícula</button>':'<button class="btn" onclick="go(\'modalidades\')">Explorar modalidades</button>'}</div><div class="toolbar"><input aria-label="Buscar matrículas" placeholder="Buscar modalidade${admin?' ou aluno':''}..." value="${esc(filter)}" oninput="setFilter(this.value)"><select aria-label="Filtrar status" onchange="setStatus(this.value)"><option value="">Todos os status</option><option ${statusFilter==='Ativa'?'selected':''}>Ativa</option><option ${statusFilter==='Inativa'?'selected':''}>Inativa</option></select></div><div class="table-wrap"><table><thead><tr>${admin?'<th>Aluno</th>':''}<th>Modalidade</th><th>Data de matrícula</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(m=>`<tr>${admin?`<td>${esc(user(m.userId)?.name||'Aluno removido')}</td>`:''}<td><strong>${esc(mod(m.modalityId)?.name||'Modalidade removida')}</strong></td><td>${date(m.date)}</td><td>${badge(m.status)}</td><td><div class="actions"><button onclick="toggleEnrollment(${m.id})">${m.status==='Ativa'?'Encerrar':'Reativar'}</button></div></td></tr>`).join('')||`<tr><td colspan="${admin?5:4}" class="empty">Nenhuma matrícula encontrada.</td></tr>`}</tbody></table></div>`}function toggleEnrollment(id){let m=db.matriculas.find(x=>x.id===id);if(!m)return;m.status=m.status==='Ativa'?'Inativa':'Ativa';if(m.status==='Inativa')db.presencas.forEach(p=>{if(p.userId===m.userId&&db.aulas.find(a=>a.id===p.aulaId)?.modalityId===m.modalityId&&db.aulas.find(a=>a.id===p.aulaId)?.date>=today())p.status='Cancelada'});save();renderBody();notify('Matrícula atualizada.')}function payments(admin){let rows=db.pagamentos.filter(p=>(admin||p.userId===me().id)&&(!filter||(p.description+' '+(user(p.userId)?.name||'')).toLowerCase().includes(filter.toLowerCase()))&&(!statusFilter||p.status===statusFilter));return `<div class="panel"><div><h1>Pagamentos</h1><p class="sub">${admin?'Controle os lançamentos e recebimentos da academia.':'Acompanhe as suas mensalidades e seus comprovantes.'}</p></div>${admin?'<button class="btn" onclick="openModal(\'payment\')">+ Novo lançamento</button>':''}</div><div class="grid" style="margin-bottom:22px">${stat('Total pago',money(rows.filter(x=>x.status==='Pago').reduce((n,x)=>n+Number(x.amount),0)),'Pagamentos registrados')}${stat('Em aberto',money(rows.filter(x=>x.status==='Pendente').reduce((n,x)=>n+Number(x.amount),0)),'Aguardando pagamento')}</div><div class="toolbar"><input aria-label="Buscar pagamentos" placeholder="Buscar lançamento${admin?' ou aluno':''}..." value="${esc(filter)}" oninput="setFilter(this.value)"><select aria-label="Filtrar status" onchange="setStatus(this.value)"><option value="">Todos os status</option><option ${statusFilter==='Pago'?'selected':''}>Pago</option><option ${statusFilter==='Pendente'?'selected':''}>Pendente</option></select></div><div class="table-wrap"><table><thead><tr>${admin?'<th>Aluno</th>':''}<th>Descrição</th><th>Valor</th><th>Vencimento</th><th>Status</th>${admin?'<th>Ação</th>':''}</tr></thead><tbody>${rows.map(p=>`<tr>${admin?`<td>${esc(user(p.userId)?.name||'Aluno removido')}</td>`:''}<td>${esc(p.description)}</td><td><strong>${money(p.amount)}</strong></td><td>${date(p.due)}</td><td>${badge(p.status)}</td>${admin?`<td><button class="link" onclick="togglePayment(${p.id})">${p.status==='Pago'?'Marcar pendente':'Marcar pago'}</button></td>`:''}</tr>`).join('')||`<tr><td class="empty" colspan="${admin?6:4}">Nenhum pagamento encontrado.</td></tr>`}</tbody></table></div>${admin?'':'<p class="help">Para efetuar um pagamento, procure a recepção da academia. Os registros são atualizados pela administração.</p>'}` }function togglePayment(id){let p=db.pagamentos.find(x=>x.id===id);if(!p)return;p.status=p.status==='Pago'?'Pendente':'Pago';save();renderBody();notify('Pagamento atualizado.')}function students(){let rows=db.users.filter(u=>u.role==='aluno'&&(`${u.name} ${u.email}`).toLowerCase().includes(filter.toLowerCase()));return `<div class="panel"><div><h1>Alunos</h1><p class="sub">Consulte os cadastros e as matrículas dos alunos.</p></div><button class="btn" onclick="openModal('student')">+ Novo aluno</button></div><div class="toolbar"><input aria-label="Buscar alunos" placeholder="Buscar nome ou e-mail..." value="${esc(filter)}" oninput="setFilter(this.value)"></div><div class="table-wrap"><table><thead><tr><th>Aluno</th><th>E-mail</th><th>Telefone</th><th>Matrículas ativas</th><th>Ação</th></tr></thead><tbody>${rows.map(u=>`<tr><td><strong>${esc(u.name)}</strong></td><td>${esc(u.email)}</td><td>${esc(u.phone||'—')}</td><td>${db.matriculas.filter(m=>m.userId===u.id&&m.status==='Ativa').length}</td><td><button class="link" onclick="openModal('student',${u.id})">Editar</button></td></tr>`).join('')||'<tr><td class="empty" colspan="5">Nenhum aluno encontrado.</td></tr>'}</tbody></table></div>`}function removeClass(id){if(!confirm('Excluir esta aula e suas confirmações de presença?'))return;db.aulas=db.aulas.filter(a=>a.id!==id);db.presencas=db.presencas.filter(p=>p.aulaId!==id);save();renderBody();notify('Aula excluída.')}function openModal(type,id){modal={type,id};render()}function closeModal(){modal=null;render()}function modalHTML(){let {type,id}=modal,x=type==='student'?db.users.find(u=>u.id===id):type==='modality'?mod(id):type==='class'?db.aulas.find(a=>a.id===id):null,title={student:id?'Editar aluno':'Novo aluno',modality:id?'Editar modalidade':'Nova modalidade',class:id?'Editar aula':'Nova aula',enrollment:'Nova matrícula',payment:'Novo lançamento'}[type];let options=(arr,selected,mapper)=>arr.map(y=>`<option value="${y.id}" ${y.id===selected?'selected':''}>${esc(mapper(y))}</option>`).join('');let fields=type==='student'?`<div class="form-grid"><label class="field">Nome<input name="name" required value="${esc(x?.name||'')}"></label><label class="field">E-mail<input name="email" type="email" required value="${esc(x?.email||'')}"></label><label class="field">Telefone<input name="phone" value="${esc(x?.phone||'')}"></label>${id?'':'<label class="field">Senha provisória<input name="password" minlength="6" required type="password" placeholder="Mínimo de 6 caracteres"></label>'}</div>`:type==='modality'?`<div class="form-grid"><label class="field">Nome<input name="name" required value="${esc(x?.name||'')}"></label><label class="field">Instrutor<input name="instructor" required value="${esc(x?.instructor||'')}"></label><label class="field">Dias<input name="days" required placeholder="Seg e qua" value="${esc(x?.days||'')}"></label><label class="field">Horário<input name="time" required placeholder="18:00" value="${esc(x?.time||'')}"></label><label class="field" style="grid-column:1/-1">Descrição<input name="description" required value="${esc(x?.description||'')}"></label></div>`:type==='class'?`<div class="form-grid"><label class="field">Modalidade<select name="modalityId" required>${options(db.modalidades,x?.modalityId,m=>m.name)}</select></label><label class="field">Instrutor<input name="instructor" required value="${esc(x?.instructor||'')}"></label><label class="field">Data<input name="date" type="date" min="${today()}" required value="${esc(x?.date||future(1))}"></label><label class="field">Horário<input name="time" type="time" required value="${esc(x?.time||'18:00')}"></label><label class="field">Vagas<input name="capacity" type="number" min="1" required value="${x?.capacity||20}"></label></div>`:type==='enrollment'?`<div class="form-grid"><label class="field">Aluno<select name="userId" required>${options(db.users.filter(u=>u.role==='aluno'),null,u=>u.name)}</select></label><label class="field">Modalidade<select name="modalityId" required>${options(db.modalidades,null,m=>m.name)}</select></label></div>`:`<div class="form-grid"><label class="field">Aluno<select name="userId" required>${options(db.users.filter(u=>u.role==='aluno'),null,u=>u.name)}</select></label><label class="field">Descrição<input name="description" required placeholder="Mensalidade · Outubro"></label><label class="field">Valor (R$)<input name="amount" type="number" step="0.01" min="0.01" required></label><label class="field">Vencimento<input name="due" type="date" required value="${future(30)}"></label></div>`;return `<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="${title}"><header><h2>${title}</h2><button aria-label="Fechar" onclick="closeModal()">×</button></header><form onsubmit="saveModal(event)">${fields}<footer><button type="button" class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" type="submit">Salvar</button></footer></form></div></div>`}function saveModal(e){e.preventDefault();if(me()?.role!=='admin')return;let f=new FormData(e.target),{type,id}=modal,val=k=>String(f.get(k)||'').trim(),num=k=>Number(f.get(k));if(type==='student'){let email=val('email').toLowerCase();if(db.users.some(u=>u.email.toLowerCase()===email&&u.id!==id))return notify('E-mail já cadastrado.');if(id){Object.assign(db.users.find(u=>u.id===id),{name:val('name'),email,phone:val('phone')})}else db.users.push({id:next(db.users),name:val('name'),email,phone:val('phone'),password:val('password'),role:'aluno'})}if(type==='modality'){let data={name:val('name'),instructor:val('instructor'),days:val('days'),time:val('time'),description:val('description'),icon:id?mod(id).icon:'✦',capacity:20};if(id)Object.assign(mod(id),data);else db.modalidades.push({id:next(db.modalidades),...data})}if(type==='class'){if(val('date')<today())return notify('Escolha uma data futura.');let count=id?db.presencas.filter(p=>p.aulaId===id&&p.status==='Confirmada').length:0;if(num('capacity')<count)return notify('As vagas não podem ser menores que as presenças confirmadas.');let data={modalityId:num('modalityId'),instructor:val('instructor'),date:val('date'),time:val('time'),capacity:num('capacity')};if(id)Object.assign(db.aulas.find(a=>a.id===id),data);else db.aulas.push({id:next(db.aulas),...data})}if(type==='enrollment'){if(db.matriculas.some(m=>m.userId===num('userId')&&m.modalityId===num('modalityId')&&m.status==='Ativa'))return notify('O aluno já tem matrícula ativa nesta modalidade.');db.matriculas.push({id:next(db.matriculas),userId:num('userId'),modalityId:num('modalityId'),date:today(),status:'Ativa'})}if(type==='payment')db.pagamentos.push({id:next(db.pagamentos),userId:num('userId'),description:val('description'),amount:num('amount'),due:val('due'),status:'Pendente'});save();closeModal();notify('Registro salvo com sucesso!')}render();
</script></body></html>
